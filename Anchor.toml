[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
papan_pesan = "6GwBt5Cv4zqQwyNnQP9oCrd6D9RuU4quW8bgMNsLRxkP"

[registry]
url = "https://api.apr.dev"

# Class runs on devnet. After `anchor keys sync`, the program id above and
# the one in lib.rs / declare_id! are updated automatically — keep them in sync.
[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
